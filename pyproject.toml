[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phads"
version = "0.6.0"
description = "PHADS-style anti-defense protein inference pipeline"
readme = "README_EN.md"
requires-python = ">=3.10"
authors = [
  { name = "PHADS developers" }
]
keywords = ["bioinformatics", "protein", "anti-defense", "HMM", "ESM2", "ProtT5"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  "biopython",
  "huggingface-hub",
  "numpy",
  "onnxruntime",
  "pandas",
  "pyrodigal",
  "pyrodigal-gv",
  "sentencepiece",
  "torch",
  "tqdm",
  "transformers"
]

[project.urls]
Homepage = "https://github.com/George-nsn/PhADS"
Documentation = "https://github.com/George-nsn/PhADS#readme"
Issues = "https://github.com/George-nsn/PhADS/issues"

[project.scripts]
phads = "phads:main"

[tool.setuptools]
py-modules = ["phads"]
